[package]
name = "rcn-recomp"
version = "0.1.0"
edition = "2021"
description = "RomCloud Native : recompilateur statique d'exécutables Windows x86-64 vers du C portable (ARM64)"
license = "MIT"

[dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info", "intel"] }

[profile.release]
opt-level = 2
