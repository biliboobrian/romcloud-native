name: RomCloud Native

# RomCloud Native (com.romcloud.rcnative) : jeux PC Windows traduits en ARM64 sur le téléphone
# (prototype de recherche), signé avec la même clé que RomCloud. APK : RomCloud-Native-<version>.apk.
# Il embarque le recompilateur (Rust, cible aarch64-linux-android) et DXVK (Meson, Ninja, NDK).
# main et pull requests : compilation (recompilateur, DXVK, APK de debug). Tag v* (ou lancement manuel) : APK
# signé, joint à la Release du tag.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write # création des Releases sur les tags

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PACKAGE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # NDK de l'Android Gradle Plugin installé à part, avec plusieurs essais : un téléchargement
      # corrompu par Gradle (« Error reading Zip content ») faisait échouer la compilation.
      - name: NDK
        run: |
          for i in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null && exit 0
            echo "Installation du NDK échouée (essai $i), nouvel essai"
            sleep 15
          done
          exit 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: romCloudNative/recompiler -> target

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # DXVK (Direct3D 9 / 11 par Vulkan) pour Android : livré dans l'APK (build/dxvk-jni).
      - name: DXVK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          pip install meson
          sudo apt-get install -y ninja-build > /dev/null
          node romCloudNative/scripts/build-dxvk.mjs

      - name: Tests et compilation
        if: env.PACKAGE != 'true'
        run: ./gradlew :romCloudNative:testDebugUnitTest :romCloudNative:assembleDebug --no-daemon

      # Code de version tiré du numéro (1.106.0 → 1106000) : toujours croissant, et au-dessus des codes
      # des versions publiées par l'ancien dépôt romCloud (numéro d'exécution du workflow).
      - name: Version
        if: env.PACKAGE == 'true'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
            CODE=$(( MAJOR * 1000000 + MINOR * 1000 + ${PATCH:-0} ))
          else
            VERSION="0.0.${{ github.run_number }}-${GITHUB_SHA::7}"
            CODE=${{ github.run_number }}
          fi
          echo "ROMCLOUD_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "ROMCLOUD_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Version : $VERSION (code $CODE)"

      # La clé de signature vient des secrets du dépôt. Sans eux (ex. pull request
      # depuis un fork), l'APK est signé avec une clé de debug temporaire.
      - name: Clé de signature
        if: env.PACKAGE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ROMCLOUD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ROMCLOUD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ROMCLOUD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ROMCLOUD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Secret ROMCLOUD_KEYSTORE_BASE64 absent : APK signé avec une clé de debug (non installable par-dessus une version signée)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "ROMCLOUD_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "ROMCLOUD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ROMCLOUD_KEY_ALIAS=$KEY_ALIAS"
            echo "ROMCLOUD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Tests et APK
        if: env.PACKAGE == 'true'
        run: ./gradlew :romCloudNative:testDebugUnitTest :romCloudNative:assembleRelease --no-daemon

      - name: Renommer les APK
        if: env.PACKAGE == 'true'
        run: |
          mkdir -p dist
          cp romCloudNative/build/outputs/apk/release/romCloudNative-release.apk "dist/RomCloud-Native-${ROMCLOUD_VERSION_NAME}.apk"

      # Lancement manuel seulement (les tags publient la Release) : gardé 7 jours, sans bloquer la
      # suite si le quota de stockage des artefacts est atteint.
      - uses: actions/upload-artifact@v7
        if: env.PACKAGE == 'true' && !startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        with:
          name: RomCloud-Native-${{ env.ROMCLOUD_VERSION_NAME }}
          path: dist/*.apk
          retention-days: 7

      - name: Release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
